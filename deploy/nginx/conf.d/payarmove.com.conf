# -----------------------------------------------------------------------------
# PayarMove Frontend Server Configuration (payarmove.com & www.payarmove.com)
# -----------------------------------------------------------------------------

# HTTP -> HTTPS Redirect & ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name payarmove.com www.payarmove.com 173.214.172.222;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://payarmove.com$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name payarmove.com www.payarmove.com;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/payarmove.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payarmove.com/privkey.pem;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Root Directory for Built Frontend SPA
    root /var/www/frontend/dist;
    index index.html;

    # SPA Routing (Single Page App)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Static Assets (JS, CSS, Images, Fonts, Wasm)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|wasm|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Don't cache index.html to ensure fresh deployment updates
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Reverse proxy to backend API if accessed via same origin path (optional convenience)
    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.payarmove.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
