openapi: 3.0.3
info:
  title: PayarMove Pay API
  version: 1.0.0
  description: Institutional cross-border mobility payments, identity verification
    (KYC), Stellar Freighter wallet connect (SEP-0010), and Soroban smart contract
    escrow.
servers:
  - url: https://api.payarmove.com
    description: Production API Server (api.payarmove.com)
  - url: http://173.214.172.222:8000
    description: VPS Direct Host (173.214.172.222)
  - url: http://localhost:8000
    description: Local Development Server
paths:
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns profile details, connected wallets, and current KYC tier
        status.
      summary: Get current user profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Update user profile details.
      summary: Update current user profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/signin/:
    post:
      operationId: auth_signin_create
      description: Authenticates user credentials and returns JWT access and refresh
        tokens.
      summary: Sign in with email and password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSigninRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserSigninRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSigninRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: JWT Token Pair & Profile
  /api/v1/auth/signup/:
    post:
      operationId: auth_signup_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignup'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/wallet/challenge/:
    post:
      operationId: auth_wallet_challenge_create
      description: Generates an unsigned SEP-0010 challenge transaction in base64
        XDR format for Freighter wallet signing.
      summary: Request SEP-0010 Stellar challenge transaction
      tags:
      - Wallet Connect (SEP-0010)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletChallengeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WalletChallengeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WalletChallengeRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletChallengeResponse'
          description: ''
  /api/v1/auth/wallet/verify/:
    post:
      operationId: auth_wallet_verify_create
      description: Verifies cryptographic signature from Freighter/Stellar wallet.
        Logs in or auto-creates user account.
      summary: Verify signed SEP-0010 challenge transaction
      tags:
      - Wallet Connect (SEP-0010)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Verified Wallet & JWT Tokens
  /api/v1/dashboard/admin/summary/:
    get:
      operationId: dashboard_admin_summary_retrieve
      description: Returns system-wide payment volume, confirmations, host disbursements,
        and KYC queue counts.
      summary: Platform administrative overview metrics
      tags:
      - Analytics & Dashboards
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/dashboard/host/summary/:
    get:
      operationId: dashboard_host_summary_retrieve
      description: Returns metrics specific to the authenticated vehicle host.
      summary: Host earnings and bookings summary
      tags:
      - Analytics & Dashboards
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostDashboard'
          description: ''
  /api/v1/escrow/{rental_id}/:
    get:
      operationId: escrow_retrieve
      summary: Query on-chain escrow state and lock status
      parameters:
      - in: path
        name: rental_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Soroban Smart Contract Escrow
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowStatus'
          description: ''
  /api/v1/escrow/{rental_id}/dispute/:
    post:
      operationId: escrow_dispute_create
      summary: Resolve vehicle deposit dispute (Admin / Arbitrator only)
      parameters:
      - in: path
        name: rental_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Soroban Smart Contract Escrow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowDisputeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EscrowDisputeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EscrowDisputeRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowStatus'
          description: ''
  /api/v1/escrow/{rental_id}/settle/:
    post:
      operationId: escrow_settle_create
      description: 'Invokes smart contract complete_and_disburse: Host gets 90%, Platform
        gets 10%, Renter gets 100% deposit refund.'
      summary: Settle rental and trigger automated payout distribution
      parameters:
      - in: path
        name: rental_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Soroban Smart Contract Escrow
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowStatus'
          description: ''
  /api/v1/escrow/{rental_id}/submit-deposit/:
    post:
      operationId: escrow_submit_deposit_create
      description: Verifies smart contract deposit on Stellar Testnet and activates
        rental booking.
      summary: Submit deposit transaction hash from Freighter
      parameters:
      - in: path
        name: rental_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Soroban Smart Contract Escrow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowDepositSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EscrowDepositSubmitRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EscrowDepositSubmitRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowStatus'
          description: ''
  /api/v1/escrow/prepare/{rental_id}/:
    post:
      operationId: escrow_prepare_create
      description: Initializes agreement terms and returns parameters for Freighter
        wallet smart contract invocation.
      summary: Prepare Soroban Escrow deposit payload
      parameters:
      - in: path
        name: rental_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Soroban Smart Contract Escrow
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Escrow contract invocation arguments
  /api/v1/kyc/admin/applications/:
    get:
      operationId: kyc_admin_applications_list
      description: Admin endpoint to audit submitted KYC records.
      summary: List all KYC applications
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - KYC Compliance (Admin)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKYCRecordDetailList'
          description: ''
  /api/v1/kyc/admin/applications/{id}/review/:
    post:
      operationId: kyc_admin_applications_review_create
      summary: Approve or reject a KYC application
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - KYC Compliance (Admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KYCReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KYCReviewRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCRecordDetail'
          description: ''
  /api/v1/kyc/status/:
    get:
      operationId: kyc_status_retrieve
      summary: Check current user KYC verification status
      tags:
      - KYC Compliance
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: KYC Tier and latest record
  /api/v1/kyc/submit/:
    post:
      operationId: kyc_submit_create
      tags:
      - kyc
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KYCSubmitRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KYCSubmitRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/KYCSubmitRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCSubmit'
          description: ''
  /api/v1/payouts/:
    get:
      operationId: payouts_list
      description: Returns all payouts and fee breakdowns credited to the vehicle
        host.
      summary: List host payout history and earnings
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Host Payouts Ledger
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHostPayoutList'
          description: ''
  /api/v1/rentals/rentals/:
    get:
      operationId: rentals_rentals_list
      description: Returns all bookings where the user is either the renter or the
        host.
      summary: List user rental agreements
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Rental Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRentalDetailList'
          description: ''
    post:
      operationId: rentals_rentals_create
      description: Initiates a rental booking. Transitions status to AWAITING_PAYMENT
        for Soroban escrow deposit.
      summary: Create vehicle rental booking agreement
      tags:
      - Rental Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RentalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RentalCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalDetail'
          description: ''
  /api/v1/rentals/rentals/{id}/:
    get:
      operationId: rentals_rentals_retrieve
      description: Inspect pricing breakdown, rental dates, vehicle, host, and escrow
        status.
      summary: Retrieve rental details and breakdown
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rental.
        required: true
      tags:
      - Rental Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalDetail'
          description: ''
    put:
      operationId: rentals_rentals_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rental.
        required: true
      tags:
      - rentals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RentalDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RentalDetailRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalDetail'
          description: ''
    patch:
      operationId: rentals_rentals_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rental.
        required: true
      tags:
      - rentals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRentalDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRentalDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRentalDetailRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalDetail'
          description: ''
    delete:
      operationId: rentals_rentals_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rental.
        required: true
      tags:
      - rentals
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/rentals/vehicles/:
    get:
      operationId: rentals_vehicles_list
      description: Browse peer-to-peer vehicles available for rental with pricing
        in Stellar USDC.
      summary: List active mobility rental vehicles
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Mobility Vehicles
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleList'
          description: ''
    post:
      operationId: rentals_vehicles_create
      description: Host adds a vehicle to the peer-to-peer marketplace.
      summary: List vehicle for rental (Hosts only)
      tags:
      - Mobility Vehicles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
  /api/v1/rentals/vehicles/{id}/:
    get:
      operationId: rentals_vehicles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this vehicle.
        required: true
      tags:
      - rentals
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    put:
      operationId: rentals_vehicles_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this vehicle.
        required: true
      tags:
      - rentals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    patch:
      operationId: rentals_vehicles_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this vehicle.
        required: true
      tags:
      - rentals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVehicleRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
          description: ''
    delete:
      operationId: rentals_vehicles_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this vehicle.
        required: true
      tags:
      - rentals
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    ActionEnum:
      enum:
      - APPROVE
      - REJECT
      type: string
      description: |-
        * `APPROVE` - APPROVE
        * `REJECT` - REJECT
    AdminDashboard:
      type: object
      properties:
        total_volume_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,7})?$
        confirmed_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,7})?$
        pending_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,7})?$
        total_host_payouts_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,7})?$
        platform_fees_collected_usdc:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,7})?$
        total_users_count:
          type: integer
        active_rentals_count:
          type: integer
        pending_kyc_count:
          type: integer
      required:
      - active_rentals_count
      - confirmed_usdc
      - pending_kyc_count
      - pending_usdc
      - platform_fees_collected_usdc
      - total_host_payouts_usdc
      - total_users_count
      - total_volume_usdc
    ContractEventLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_topic:
          type: string
          maxLength: 100
        tx_hash:
          type: string
          nullable: true
          maxLength: 64
        ledger_sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        raw_data: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_topic
      - id
    DocumentTypeEnum:
      enum:
      - NATIONAL_ID
      - PASSPORT
      - DRIVERS_LICENSE
      - VEHICLE_LOGBOOK
      type: string
