        public_key:
          type: string
          minLength: 56
          maxLength: 56
        signed_xdr:
          type: string
          minLength: 1
          description: Base64 encoded signed challenge transaction
        wallet_type:
          allOf:
          - $ref: '#/components/schemas/WalletTypeEnum'
          default: FREIGHTER
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: RENTER
          description: |-
            Role to assign if creating a new user upon wallet connect

            * `RENTER` - Renter
            * `HOST` - Vehicle Host
            * `ADMIN` - Platform Administrator
      required:
      - public_key
      - signed_xdr
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
