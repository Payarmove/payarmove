[package]
name = "payarmove-escrow"
version = "0.1.0"
edition = "2021"
authors = ["PayarMove Platforms Africa Ltd <dev@payarmove.io>"]
description = "Trustless Soroban escrow smart contract for peer-to-peer mobility rentals, security deposits, and automated host payouts."

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.4.0"

[dev-dependencies]
soroban-sdk = { version = "21.4.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
codegen-units = 1
lto = true
